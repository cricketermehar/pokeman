[kinancity]
# ─────────────────────────────────────────────────────────────────────────────
# KinanCity Python Automation — Configuration
# ─────────────────────────────────────────────────────────────────────────────
# DO NOT put credentials here.
# Account credentials go in accounts.txt (which is gitignored).
# ─────────────────────────────────────────────────────────────────────────────

# Path to your accounts file (one username:password per line)
accounts_file = accounts.txt

# Path to the runtime queue state file (auto-generated, gitignored)
state_file = queue_state.json

# Path to KinanCity-mail links.log (set to match where your jar writes it)
links_log = links.log

# ── Retry behaviour ───────────────────────────────────────────────────────────
# Number of attempts before an account is marked MANUAL_REQUIRED
max_retries = 3

# Base backoff delay in seconds (doubles each retry: 60 → 120 → 240)
base_delay_s = 60

# Maximum delay cap in seconds (regardless of backoff formula)
max_delay_s = 300

# ── Activation timeout ────────────────────────────────────────────────────────
# How long to wait for a Pokémon activation email before timing out (seconds)
activation_timeout_s = 600

# How often to poll links.log for the activation link (seconds)
activation_poll_s = 30

# ── Registration email ────────────────────────────────────────────────────────
# The email address used for Pokémon Trainer Central registration.
# Set this to your Proton Mail address (or whatever mailbox you control).
# NEVER put credentials here — only the email address.
email =

# ── KinanCity-mail settings ───────────────────────────────────────────────────
# Port for the local KinanCity-mail SMTP server
mail_smtp_port = 2525

# ── Logging ───────────────────────────────────────────────────────────────────
# Log directory (relative to python-automation/)
log_dir = logs

# Log level: DEBUG, INFO, WARNING, ERROR
log_level = INFO
